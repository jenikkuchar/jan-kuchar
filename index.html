<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jan Kuchař</title>
<meta name="description" content="Jan Kuchař – AI, technologie, inovace.">
<meta name="theme-color" content="#08080c">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Jan Kuchař">
<meta property="og:description" content="Jan Kuchař – AI, technologie, inovace.">
<meta property="og:url" content="https://jan-kuchar.cz">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;
  --glass:rgba(32,32,40,.72);
  --stroke:rgba(255,255,255,.1);
  --stroke-2:rgba(255,255,255,.14);
  --text:#f5f5f7;
  --text-2:rgba(235,235,245,.6);
  --text-3:rgba(235,235,245,.38);
  --blue:#0a84ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 50% at 50% 30%,rgba(94,92,230,.2),transparent 70%),
    radial-gradient(40% 40% at 85% 95%,rgba(255,55,95,.09),transparent 70%),
    radial-gradient(35% 35% at 10% 90%,rgba(10,132,255,.07),transparent 70%),var(--bg)}

main{width:min(760px,calc(100vw - 32px));margin:0 auto;padding-top:clamp(56px,18vh,180px);padding-bottom:60px;
  transition:padding-top .4s cubic-bezier(.2,.9,.3,1)}
body.searching main{padding-top:clamp(40px,10vh,110px)}

header{text-align:center}
h1{font-size:clamp(46px,9vw,76px);font-weight:200;letter-spacing:-.04em;line-height:1}
h1 b{font-weight:600}
.tagline{margin:14px 0 38px;font-size:16px;color:var(--text-2)}

/* ---------- Vyhledávání ---------- */
.search{background:var(--glass);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  border-radius:29px;box-shadow:0 0 0 .5px var(--stroke-2) inset,0 40px 100px -20px rgba(0,0,0,.8);overflow:hidden;
  transition:border-radius .25s}
body.searching .search{border-radius:18px}
.bar{display:flex;align-items:center;gap:14px;padding:0 22px;height:58px}
.bar svg{flex:none;opacity:.55}
.bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:20px;font-weight:300;caret-color:var(--blue)}
.bar input::placeholder{color:var(--text-3)}
kbd{font-family:inherit;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.08);border-radius:5px;padding:2px 7px;box-shadow:0 0 0 .5px var(--stroke) inset;white-space:nowrap}
body.searching .bar kbd.k{display:none}
.clear{display:none;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);place-items:center;flex:none}
body.searching .clear{display:grid}

.panel{display:none;border-top:.5px solid var(--stroke);height:400px}
body.searching .panel{display:flex;animation:open .22s ease-out}
@keyframes open{from{opacity:0;transform:translateY(-4px)}}
.list{width:290px;flex:none;border-right:.5px solid var(--stroke);padding:8px;overflow:auto}
.sec{font-size:11px;font-weight:600;color:var(--text-3);padding:10px 10px 6px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;font-size:14px;width:100%;text-align:left}
.row small{margin-left:auto;font-size:11px;opacity:.6;white-space:nowrap}
.row.sel{background:var(--blue)}
.row:not(.sel):hover{background:rgba(255,255,255,.06)}
.empty{padding:22px 12px;color:var(--text-2);font-size:13px;line-height:1.5}

.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:14px;color:#fff;font-weight:600;
  box-shadow:0 0 0 .5px rgba(255,255,255,.15) inset}
.ico.big{width:52px;height:52px;border-radius:13px;font-size:24px}

.prev{flex:1;min-width:0;padding:28px 30px;overflow:auto}
.prev h2{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:14px 0 8px}
.prev p{font-size:14px;line-height:1.65;color:rgba(245,245,247,.82);margin-bottom:12px}
.prev .dim{color:var(--text-2)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;margin-top:22px;padding-top:14px;border-top:.5px solid var(--stroke)}
.meta span:nth-child(odd){color:var(--text-3);text-align:right}
.back{display:none;color:var(--blue);font-size:15px;margin-bottom:6px}

/* Kontaktní karta */
.contact{display:flex;gap:18px;align-items:center;margin-top:4px}
.av{width:76px;height:76px;border-radius:50%;flex:none;padding:2px;background:conic-gradient(from 210deg,#0a84ff,#bf5af2,#ff375f,#ff9f0a,#0a84ff)}
.av div{width:100%;height:100%;border-radius:50%;background:#15151d;display:grid;place-items:center;font-weight:700;font-size:26px}
.contact h2{margin:0 0 2px}
.acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--blue);width:76px;padding:6px 0;border-radius:10px;transition:background .15s}
.act:hover{background:rgba(10,132,255,.1)}
.act i{width:42px;height:42px;border-radius:50%;background:rgba(10,132,255,.16);display:grid;place-items:center;font-style:normal;font-size:16px;font-weight:600}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* Návrhy pod polem */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
body.searching .chips{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.06);
  box-shadow:0 0 0 .5px var(--stroke-2) inset;color:rgba(235,235,245,.82);transition:background .15s}
button.chip:hover{background:rgba(255,255,255,.12)}

footer{position:fixed;left:0;right:0;bottom:18px;text-align:center;font-size:12px;color:var(--text-3);pointer-events:none}
body.searching footer{display:none}

/* ---------- Mobil ---------- */
@media (max-width:640px){
  main{padding-top:72px}
  body.searching main{padding-top:24px}
  body.searching header{display:none}
  .tagline{margin-bottom:26px}
  .bar{height:50px;padding:0 16px}
  .bar input{font-size:17px}
  .bar kbd.k{display:none}
  .panel{height:auto}
  .list{width:100%;border-right:0}
  .prev{display:none;padding:18px 18px 24px}
  .panel.detail .list{display:none}
  .panel.detail .prev{display:block}
  .back{display:inline-block}
  .row{padding:11px 10px;font-size:16px}
  .row.sel{background:transparent}
  footer{position:static;margin-top:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main>
  <header>
    <h1>Jan <b>Kuchař</b></h1>
    <p class="tagline">AI · Technologie · Inovace · Hory · Příroda</p>
  </header>

  <div class="search" role="search">
    <div class="bar">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><circle cx="6.5" cy="6.5" r="5"/><path d="m10.5 10.5 4 4" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="Hledat ve Spotlightu" autocomplete="off" spellcheck="false"
             aria-label="Hledat" aria-controls="list" aria-autocomplete="list">
      <button class="clear" id="clear" aria-label="Smazat"><svg width="8" height="8" viewBox="0 0 8 8" stroke="#000" stroke-width="1.6" stroke-linecap="round"><path d="M1 1l6 6M7 1 1 7"/></svg></button>
      <kbd class="k">⌘K</kbd>
    </div>
    <div class="panel" id="panel">
      <div class="list" id="list" role="listbox" aria-label="Výsledky"></div>
      <div class="prev" id="prev" aria-live="polite"></div>
    </div>
  </div>

  <div class="chips" id="chips"></div>
</main>

<footer>Napiš cokoliv – nebo zkus „kontakt“ · © <span id="year"></span> Jan Kuchař</footer>

<script>
/* ======== Obsah – uprav podle sebe ======== */
// E-mail je zakódovaný jako kódy znaků, aby ho roboti nenašli ve zdrojovém kódu – skládá se až v prohlížeči
const EMAIL = String.fromCharCode(106,97,110,46,107,117,99,104,97,114,64,105,99,108,111,117,100,46,99,111,109);
const LINKEDIN = 'https://www.linkedin.com/in/jan-kucha%C5%99-16925532/';

const G = {                                     // barvy ikon
  blue:'linear-gradient(160deg,#5ac8fa,#0a60ff)', yellow:'linear-gradient(160deg,#ffd60a,#ff9f0a)',
  pink:'linear-gradient(160deg,#ff6482,#fa233b)', green:'linear-gradient(160deg,#30d158,#1fa045)',
  purple:'linear-gradient(160deg,#bf5af2,#5e5ce6)', brown:'linear-gradient(160deg,#c08552,#7b4a24)',
};

// section: skupina v seznamu · chip: návrh pod polem · keys: slova, podle kterých se položka najde (bez diakritiky)
// hidden: v seznamu se neukáže, najde se jen když se na ni někdo zeptá
const ITEMS = [
  { id:'kdo', section:'O Janovi', title:'Kdo jsem', icon:'👤', color:G.blue, kind:'Info', chip:'👋 Kdo jsi?',
    keys:'kdo jsi jan honza o mne about info jmeno clovek beskydy odkud hory priroda',
    body:`<p>Jmenuji se Honza a jsem z Beskyd. Baví mě AI, technologie a všechno kolem nich a taky mě to živí.</p>
          <p>Odreagovat se chodím do přírody, nejraději někam do hor.</p>`,
    meta:[['Druh','Info'],['Lokalita','Beskydy'],['Režim','výhradně tmavý']] },
  { id:'co', section:'O Janovi', title:'Co dělám', icon:'✦', color:G.yellow, kind:'Poznámka', chip:'💼 Co děláš?',
    keys:'co delas prace job zamestnani pozice product owner hp tronic datart eta nay ai umela inteligence ecommerce eshop automatizace',
    body:`<p>Aktuálně pracuji jako <b>Product Owner</b> v doméně e-commerce AI ve společnosti <b>HP Tronic</b> (Datart, ETA, NAY a další).</p>
          <p class="dim">Méně omáčky, více AI.</p>`,
    meta:[['Druh','Poznámka'],['Upraveno','dnes'],['Štítky','AI · e-commerce · automatizace']] },
  { id:'zajmy', section:'O Janovi', title:'Zájmy', icon:'♥', color:G.pink, kind:'Seznam', chip:'✨ Co tě baví?',
    keys:'zajmy konicky hobby bavi volny cas sport hory priroda cestovani turistika',
    body:`<p>Co mě baví mimo práci:</p>
          <div class="tags"><span class="chip">🏃 Sport</span><span class="chip">🏔️ Hory</span><span class="chip">🌲 Příroda</span><span class="chip">✈️ Cestování</span></div>` },
  { id:'kontakt', section:'O Janovi', title:'Kontakt', icon:'✉', color:G.green, kind:'Kontakt', chip:'✉️ Jak tě kontaktovat?',
    keys:'kontakt email mail napis spojeni linkedin', contact:true },
  { id:'mail', section:'Akce', title:'Napsat e-mail', icon:'✉', color:G.green, kind:'Akce', href:'mailto:'+EMAIL,
    keys:'napsat email mail zprava', sub:EMAIL },
  { id:'li', section:'Odkazy', title:'LinkedIn', icon:'in', color:'#0a66c2', kind:'↗', href:LINKEDIN,
    keys:'linkedin profil cv zivotopis', sub:'Profesní profil' },
  { id:'caj', section:'Jiné', title:'Čaj', icon:'🫖', color:G.brown, kind:'Easter egg', hidden:true,
    keys:'caj tea konvice',
    body:`<p>No jasně, jdu si uvařit 🫖</p>` },
  { id:'light', section:'Jiné', title:'Světlý režim', icon:'☀', color:G.purple, kind:'Nastavení', hidden:true,
    keys:'svetly rezim light mode bily theme tema',
    body:`<p>To neprojde! 🌙</p><p class="dim">Tahle stránka je výhradně v tmavém režimu.</p>` },
];

/* ======== Logika ======== */
const $ = s => document.querySelector(s);
const q = $('#q'), list = $('#list'), prev = $('#prev'), panel = $('#panel');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const isMobile = () => matchMedia('(max-width:640px)').matches;
let results = [], sel = 0;

$('#year').textContent = new Date().getFullYear();

const icon = (it, big) => `<span class="ico${big ? ' big' : ''}" style="background:${it.color}" aria-hidden="true">${it.icon}</span>`;

function search(query){
  const n = norm(query);
  if (!n) return ITEMS.filter(i => !i.hidden);
  const words = n.split(/\s+/);
  return ITEMS
    .map(it => {
      const title = norm(it.title), hay = title + ' ' + it.keys;
      if (!words.every(w => hay.includes(w))) return null;
      return { it, score: title.startsWith(n) ? 0 : title.includes(n) ? 1 : 2 };
    })
    .filter(Boolean)
    .sort((a, b) => a.score - b.score)
    .map(r => r.it);
}

function renderList(){
  if (!results.length) {
    list.innerHTML = `<div class="empty">Nic jsem nenašel. Zkus třeba „kdo“, „co děláš“, „zájmy“ nebo „kontakt“.</div>`;
    prev.innerHTML = ''; return;
  }
  let html = '', lastSec = null;
  results.forEach((it, i) => {
    const best = i === 0 && results.length > 1;
    const sec = best ? 'Nejlepší shoda' : it.section;
    if (sec !== lastSec) html += `<div class="sec">${sec}</div>`;
    lastSec = best ? null : sec;
    html += `<button class="row${i === sel ? ' sel' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}">${icon(it)}${it.title}<small>${it.kind}</small></button>`;
  });
  list.innerHTML = html;
  renderPreview();
}

function renderPreview(){
  const it = results[sel]; if (!it) return;
  const back = `<button class="back" id="back">‹ Zpět</button>`;
  if (it.contact) {
    prev.innerHTML = back + `
      <div class="contact"><div class="av"><div>JK</div></div>
        <div><h2>Jan Kuchař</h2><div class="dim">Ozvi se – rád pokecám o AI a produktech.</div></div></div>
      <div class="acts">
        <a class="act" href="mailto:${EMAIL}"><i>✉</i>E-mail</a>
        <a class="act" href="${LINKEDIN}" target="_blank" rel="noopener"><i>in</i>LinkedIn</a>
      </div>
      <div class="meta"><span>E-mail</span><span>${EMAIL}</span><span>LinkedIn</span><span>Jan Kuchař</span></div>`;
  } else if (it.href) {
    const ext = it.href.startsWith('http') ? 'target="_blank" rel="noopener"' : '';
    prev.innerHTML = back + `${icon(it, true)}<h2>${it.title}</h2>
      <p class="dim">${it.sub || it.href.replace(/^https?:\/\//, '')}</p>
      <div class="acts"><a class="act" href="${it.href}" ${ext}><i>↗</i>Otevřít</a></div>
      <div class="meta"><span>Otevřít</span><span><kbd>↵ Enter</kbd></span></div>`;
  } else {
    prev.innerHTML = back + `${icon(it, true)}<h2>${it.title}</h2>${it.body}` +
      (it.meta ? `<div class="meta">${it.meta.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>` : '');
  }
  $('#back').onclick = () => panel.classList.remove('detail');
}

function update(){
  document.body.classList.toggle('searching', q.value.trim() !== '');
  results = search(q.value); sel = 0;
  panel.classList.remove('detail');
  renderList();
}

function choose(i, viaKeyboard){
  sel = i;
  const it = results[i];
  if (it.href && viaKeyboard) { window.open(it.href, it.href.startsWith('http') ? '_blank' : '_self'); return; }
  renderList();
  if (isMobile()) { panel.classList.add('detail'); window.scrollTo({ top:0 }); }
}

q.addEventListener('input', update);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { q.value = ''; update(); return; }
  if (!results.length) return;
  if (e.key === 'ArrowDown') { sel = (sel + 1) % results.length; renderList(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = (sel - 1 + results.length) % results.length; renderList(); e.preventDefault(); }
  else if (e.key === 'Enter') { choose(sel, true); }
  list.querySelector('.sel')?.scrollIntoView({ block:'nearest' });
});
list.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) choose(+r.dataset.i); });
list.addEventListener('mousemove', e => {
  const r = e.target.closest('.row'); if (!r || isMobile() || +r.dataset.i === sel) return;
  sel = +r.dataset.i; renderList();
});
$('#clear').onclick = () => { q.value = ''; update(); q.focus(); };

// Návrhy pod polem
$('#chips').innerHTML = ITEMS.filter(i => i.chip).map(i => `<button class="chip" data-id="${i.id}">${i.chip}</button>`).join('');
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  q.value = ITEMS.find(i => i.id === c.dataset.id).title; update();
  if (isMobile()) choose(0); else q.focus();
});

// ⌘K / Ctrl+K / "/" – zaměřit hledání
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k' || e.key === '/' && document.activeElement !== q) {
    e.preventDefault(); q.focus(); q.select();
  }
});

update();
if (!isMobile()) q.focus();
</script>
</body>
</html>
